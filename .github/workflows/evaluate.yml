name: Evaluate & Benchmark

on:
  push:
    paths:
      - "checkpoints/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Path to model checkpoint (zip)"
        required: true
        default: "checkpoints/final_model.zip"

jobs:
  evaluate:
    name: Evaluate Fault Scenarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Download checkpoint artifact (if from workflow)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trained-model-latest
          path: checkpoints/

      - name: Run evaluation suite
        run: |
          python scripts/evaluate.py \
            --checkpoint ${{ github.event.inputs.checkpoint || 'checkpoints/final_model' }} \
            --scenarios configs/eval_scenarios.yaml \
            --output-dir eval_results/

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: eval_results/
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## 📊 Evaluation Results\n\n';
            try {
              const metrics = JSON.parse(fs.readFileSync('eval_results/metrics.json', 'utf8'));
              summary += `| Scenario | Pos RMSE | Att RMSE | Recovery |\n`;
              summary += `|----------|----------|----------|----------|\n`;
              for (const [name, m] of Object.entries(metrics)) {
                summary += `| ${name} | ${m.pos_rmse?.toFixed(3)} | ${m.att_rmse?.toFixed(3)} | ${m.recovered ? '✅' : '❌'} |\n`;
              }
            } catch(e) {
              summary += '_Metrics file not found._';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
