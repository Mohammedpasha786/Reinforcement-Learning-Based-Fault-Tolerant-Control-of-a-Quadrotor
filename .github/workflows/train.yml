name: Train Agent

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Training config file (in configs/)"
        required: true
        default: "train_ppo.yaml"
      run_name:
        description: "Experiment run name"
        required: false
        default: ""
      n_envs:
        description: "Number of parallel environments"
        required: false
        default: "4"
      upload_artifact:
        description: "Upload trained model as artifact"
        type: boolean
        default: true

jobs:
  train:
    name: Train RL-FTC Agent
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run training
        run: |
          python scripts/train.py \
            --config configs/${{ github.event.inputs.config }} \
            --n-envs ${{ github.event.inputs.n_envs }} \
            ${{ github.event.inputs.run_name != '' && format('--run-name {0}', github.event.inputs.run_name) || '' }}

      - name: Upload model checkpoint
        if: ${{ github.event.inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_id }}
          path: checkpoints/
          retention-days: 30

      - name: Upload training logs
        uses: actions/upload-artifact@v4
        with:
          name: training-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
